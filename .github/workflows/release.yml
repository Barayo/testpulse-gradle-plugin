name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'Barayo/testpulse-gradle-plugin'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install semantic-release (Angular-commit-convention versioning, matches CLAUDE.md's standing convention)
        run: npm install -g semantic-release @semantic-release/exec @semantic-release/git @semantic-release/github
      - name: Capture build.gradle.kts version before semantic-release
        if: github.event_name == 'push'
        run: echo "PRE_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_ENV"
      - name: Semantic release (version, changelog, tag, GitHub release -- Plugin Portal publish happens as its own step below)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Publish to the Gradle Plugin Portal, if semantic-release bumped the version
        # A plain step, not run through semantic-release itself -- mirrors the lesson
        # learned publishing testpulse-jest: invoking a publish command through
        # semantic-release's own subprocess-spawning plugins can silently lose
        # environment/context a direct workflow step has. Gated on the version actually
        # having changed, since this step always runs on push and would otherwise
        # attempt a harmless-but-noisy republish on every push with no releasable
        # commits (the Gradle Plugin Portal, unlike npm/Maven Central, has no OIDC
        # bootstrap problem -- GRADLE_PUBLISH_KEY/SECRET can publish the very first
        # version too, no manual bootstrap publish required).
        if: github.event_name == 'push'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          POST_VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed 's/version = "\(.*\)"/\1/')
          if [ "$PRE_VERSION" != "$POST_VERSION" ]; then
            ./gradlew publishPlugins
          else
            echo "No version change ($PRE_VERSION) -- nothing to publish."
          fi
      - name: Publish already-tagged version (manual recovery)
        # Mirrors the other three plugins' recovery step: semantic-release's git-tag
        # push happens before the publish step even attempts the registry, so a failed
        # publish can still leave a real tag with nothing actually published for it. A
        # manual dispatch here just publishes whatever's currently checked out.
        if: github.event_name == 'workflow_dispatch'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins
